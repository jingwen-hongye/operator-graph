<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CANN 算子图谱</title>
  <link rel="stylesheet" href="../pto-design-system/tokens/foundation.css">
  <link rel="stylesheet" href="../pto-design-system/tokens/semantic.css">
  <link rel="stylesheet" href="../pto-design-system/tokens/components.css">
  <link rel="stylesheet" href="../pto-design-system/css/style.css">
  <link rel="stylesheet" href="../pto-design-system/patterns/workbench-shell/pattern.css">
  <link rel="stylesheet" href="../pto-design-system/patterns/ide-frame/pattern.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section class="pto-ide-frame operator-frame" data-ide-frame data-host="standalone" data-cursor-dots="true" aria-label="CANN 算子图谱演示">
    <header class="pto-ide-frame__topbar pto-ide-frame__standalone-chrome">
      <div class="pto-ide-frame__topbar-left">
        <div class="pto-ide-frame__host-chip">
          <svg class="pto-ide-frame__host-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 4v16"></path>
            <path d="M4 12h16"></path>
          </svg>
          CANN 算子图谱
        </div>
        <div class="pto-ide-frame__workspace">
          <span class="operator-muted">本地演示</span>
        </div>
      </div>
      <div class="pto-ide-frame__topbar-center">
        <label class="operator-search pto-ide-frame__search">
          <svg class="pto-ide-frame__search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input id="operator-search-input" type="search" placeholder="搜索算子、分类或依赖关系">
        </label>
      </div>
      <div class="pto-ide-frame__topbar-right">
        <div class="pto-ide-frame__window-actions" aria-label="窗口操作">
          <button class="pto-ide-frame__window-action" type="button" id="fit-graph" title="适应图谱" aria-label="适应图谱">
            <svg class="pto-ide-frame__window-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
              <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
              <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
            </svg>
          </button>
          <button class="pto-ide-frame__window-action is-selected" type="button" id="toggle-inspector" title="显示或隐藏算子详情" aria-label="显示或隐藏算子详情" aria-pressed="true">
            <svg class="pto-ide-frame__window-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <path d="M15 3v18"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="pto-ide-frame__body">
      <nav class="pto-ide-frame__activity-rail pto-ide-frame__standalone-chrome" aria-label="活动栏">
        <button class="btn btn-icon btn-ghost pto-ide-frame__rail-button is-selected" type="button" data-ide-toggle="explorer" aria-label="显示或隐藏算子目录" aria-controls="operator-explorer-pane" aria-expanded="true" aria-pressed="true" title="算子目录">
          <svg class="pto-ide-frame__rail-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9l-.81-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path>
          </svg>
        </button>
        <button class="btn btn-icon btn-ghost pto-ide-frame__rail-button" type="button" title="搜索" aria-label="搜索">
          <svg class="pto-ide-frame__rail-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </button>
        <button class="btn btn-icon btn-ghost pto-ide-frame__rail-button" type="button" title="源代码管理" aria-label="源代码管理">
          <svg class="pto-ide-frame__rail-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="18" cy="18" r="3"></circle>
            <circle cx="6" cy="6" r="3"></circle>
            <path d="M13 6h3a2 2 0 0 1 2 2v7"></path>
            <path d="M6 9v12"></path>
          </svg>
        </button>
        <button class="btn btn-icon btn-ghost pto-ide-frame__rail-button" type="button" title="终端" aria-label="终端">
          <svg class="pto-ide-frame__rail-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m7 9 3 3-3 3"></path>
            <path d="M12 15h5"></path>
          </svg>
        </button>
      </nav>

      <div class="pto-ide-frame__workarea">
        <div class="pto-ide-frame__split" data-ide-split="operator-vertical" data-split-direction="vertical" data-sizes="78,22" data-min-size="380,150" data-storage-key="operator-graph-pto-vertical-v1">
          <section class="pto-ide-frame__pane pto-ide-frame__pane--stack" data-ide-pane="main-row">
            <div class="pto-ide-frame__split" data-ide-split="standalone-main" data-split-direction="horizontal" data-sizes="21,55,24" data-pixel-sizes="286" data-min-size="240,460,280" data-storage-key="operator-graph-pto-main-v1">
              <aside class="pto-ide-frame__pane pto-ide-frame__explorer" data-ide-pane="explorer" id="operator-explorer-pane">
                <header class="pto-ide-frame__pane-header">
                  <span class="pto-ide-frame__pane-title">算子目录</span>
                  <span class="pto-ide-frame__pane-meta" id="visible-count">0 个可见算子</span>
                </header>
                <div class="pto-ide-frame__pane-body operator-pane-scroll">
                  <section class="operator-section">
                    <div class="operator-section-title">算子分类</div>
                    <div id="category-list" class="operator-tree"></div>
                  </section>
                  <section class="operator-section">
                    <div class="operator-section-title">图谱统计</div>
                    <div class="operator-stat-grid">
                      <div>
                        <span class="operator-stat-value" id="stat-nodes">0</span>
                        <span class="operator-stat-label">算子</span>
                      </div>
                      <div>
                        <span class="operator-stat-value" id="stat-links">0</span>
                        <span class="operator-stat-label">关系</span>
                      </div>
                    </div>
                  </section>
                  <section class="operator-section">
                    <div class="operator-section-title">关系类型</div>
                    <div class="operator-legend">
                      <span><i class="operator-line-swatch variant"></i>variant</span>
                      <span><i class="operator-line-swatch l0op"></i>l0op_call</span>
                      <span><i class="operator-line-swatch microapi"></i>microapi</span>
                    </div>
                  </section>
                </div>
              </aside>

              <main class="pto-ide-frame__pane" data-ide-pane="editor-preview">
                <div class="pto-ide-frame__tabstrip">
                  <div class="tab-control" aria-label="图谱标签">
                    <button class="tab-control-item is-selected" type="button">operator-graph.svg</button>
                    <button class="tab-control-item" type="button">dependency-map.json</button>
                  </div>
                </div>
                <header class="pto-ide-frame__pane-header">
                  <span class="pto-ide-frame__pane-title">算子图谱</span>
                  <span class="pto-ide-frame__pane-meta" id="graph-readout">拖动画布、滚轮缩放、点击节点</span>
                </header>
                <div class="pto-ide-frame__pane-body operator-graph-host">
                  <svg id="operator-graph" role="img" aria-label="CANN 算子依赖图谱">
                    <g id="graph-viewport">
                      <g id="graph-links"></g>
                      <g id="graph-nodes"></g>
                    </g>
                  </svg>
                  <div id="operator-tooltip" class="operator-tooltip" hidden></div>
                </div>
              </main>

              <aside class="pto-ide-frame__pane" data-ide-pane="inspector" id="operator-inspector-pane">
                <header class="pto-ide-frame__pane-header">
                  <span class="pto-ide-frame__pane-title">算子详情</span>
                  <span class="pto-ide-frame__pane-meta" id="selected-meta">未选择</span>
                </header>
                <div class="pto-ide-frame__pane-body inspector-rail" id="operator-inspector"></div>
              </aside>
            </div>
          </section>

          <section class="pto-ide-frame__pane pto-ide-frame__bottom-dock" data-ide-pane="bottom-panel">
            <div class="pto-ide-frame__bottom-view" data-ide-bottom-panel="visualization">
              <header class="pto-ide-frame__pane-header">
                <span class="pto-ide-frame__pane-title">依赖关系</span>
                <span class="pto-ide-frame__pane-meta" id="edge-meta">可见关系</span>
              </header>
              <div class="pto-ide-frame__pane-body operator-edge-table-wrap">
                <table class="operator-edge-table">
                  <thead>
                    <tr>
                      <th>来源</th>
                      <th>类型</th>
                      <th>目标</th>
                      <th>含义</th>
                    </tr>
                  </thead>
                  <tbody id="edge-table-body"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>

        <footer class="pto-ide-frame__status-strip pto-ide-frame__standalone-chrome">
          <span id="status-left">PTO 框架：ide-frame + workbench-shell</span>
          <span id="status-right">模拟数据 / 仅本地</span>
        </footer>
      </div>
    </div>
  </section>

  <script src="../pto-design-system/patterns/workbench-shell/pattern.js"></script>
  <script src="../pto-design-system/patterns/ide-frame/pattern.js"></script>
  <script src="./operator-data.js"></script>
  <script src="./operator-tree.js"></script>
  <script src="./scroll-indicator.js"></script>
  <script src="./app.js"></script>
</body>
</html>
